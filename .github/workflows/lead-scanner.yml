name: Lead Scan

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run lead scanner
        run: node lead-scanner.js

      - name: Commit updated leads-feed.json
        run: |
          git config user.name "lead-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add leads-feed.json
          git diff --staged --quiet || git commit -m "Lead scan: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
